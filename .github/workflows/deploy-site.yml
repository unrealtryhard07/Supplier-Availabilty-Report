name: Deploy report site

# Publishes the report page (no data inside) and the data function to
# Cloudflare Pages. Runs when the report or the function changes on main;
# the data itself is refreshed separately every hour.
on:
  push:
    branches: [main]
    paths:
      - supplier-availability-report.html
      - cloudflare/functions/**
      - tools/build_site.py
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the page
        run: python3 tools/build_site.py
      - name: Deploy to Cloudflare Pages
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy public --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch main --commit-dirty=true
